<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
<title>MSD prototipi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;500;600;700;800;900&family=Sofia+Sans+Condensed:wght@700;800;900&display=swap">
<style>
/* Layout: ikki telefon yonma-yon. Mijoz ilovasi = ustaning ko'k ish gilamchasi (setka, chizg'ich), ustida qavatma-qavat ochilgan telefon. Urg'u rangi — shleyf zarg'aldog'i. */
:root{
  --bg:#E9EEF6; --ink:#0B1F44; --muted:#5E6B82; --line:#D9E1EC; --panel:#fff; --frame:#0B1430;
  --mat:#1559D6; --mat2:#0D3C9E; --flex:#F08A24; --flex2:#B45A06; --green:#1A8F46; --red:#D6332A;
  --f:'Sofia Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --fc:'Sofia Sans Condensed','Sofia Sans','Arial Narrow',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1124;--ink:#E8EDF7;--muted:#93A0B8;--line:#233150;--panel:#131C33;--frame:#000;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A1124;--ink:#E8EDF7;--muted:#93A0B8;--line:#233150;--panel:#131C33;--frame:#000;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.4;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
[data-go],[data-tab]{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,[role=button]:focus-visible{outline:3px solid var(--flex);outline-offset:2px}
.duo{flex:1;display:flex;justify-content:center;align-items:center;gap:clamp(20px,4vw,56px);padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.cap{font:700 13px var(--f);color:var(--muted)}
.phone{--w:min(376px,calc((100vh - 66px)*380/800),calc((100vw - 100px)/2));position:relative;width:var(--w);height:calc(var(--w)*800/380);flex:none;background:var(--frame);border-radius:48px;padding:10px;box-shadow:0 34px 60px -24px rgba(11,31,68,.55)}
.screen{position:relative;width:100%;height:100%;border-radius:38px;overflow:hidden;background:#F2F5FA;color:#0B1F44;display:flex;flex-direction:column;font-size:14px;--ink:#0B1F44;--muted:#5E6B82;--line:#E1E7F0}
.sw,#gt{display:none}
@media (max-width:819px){
  .sw{flex:none;display:flex;gap:6px;padding-block:6px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line)}
  .sw button{flex:1;min-height:42px;border-radius:12px;font-weight:700;font-size:15px;color:var(--muted);position:relative;text-align:center}
  .sw button.on{background:#0B1F44;color:#fff}
  .sw i{position:absolute;top:6px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--red)}
  .duo{display:block;padding:0;min-height:0}.col{height:100%;gap:0}.cap{display:none}
  body:not(.show-a) #colA,body.show-a #colC{display:none}
  .phone{width:100%;height:100%;border-radius:0;padding:0;box-shadow:none}
  .screen,.ovl{border-radius:0!important}.ovl{inset:0!important}
  #gt.on{display:flex;position:fixed;z-index:50;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:#0B1F44;color:#fff;border-radius:14px;padding:12px 14px;gap:10px;align-items:center;font-size:14px;box-shadow:0 12px 30px -8px rgba(0,0,0,.5)}
  #gt span{flex:1}#gt b{color:#FFB869;white-space:nowrap}
}
/* umumiy */
.sbar{flex:none;height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:13px;font-weight:700}
.sbar.mat{background:var(--mat);color:#fff}.sbar.ink{background:#0B1F44;color:#fff}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}.scroll::-webkit-scrollbar,.hx::-webkit-scrollbar{display:none}
.pad{padding:14px 16px 108px;display:flex;flex-direction:column;gap:16px}
.ic{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-4px}
.hx{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.h{font:800 21px/1.15 var(--fc);letter-spacing:-.005em;margin:0}
.hrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hrow button,.hrow a{color:var(--mat);font-weight:700;font-size:14px}
.box{background:#fff;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:6px 0;border-bottom:1px dashed var(--line)}.kv:last-child{border:0}
.kv>span{color:var(--muted)}.kv>b{text-align:right;min-width:0;font-weight:700}
.price{font:800 18px/1 var(--fc);font-variant-numeric:tabular-nums;white-space:nowrap}.price small{font-size:.68em;font-weight:700;opacity:.7}
.price.red{color:var(--red)}s{color:#8793A8;font-weight:500}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:0 16px;border-radius:15px;background:var(--mat);color:#fff;font:700 16px var(--f);text-align:center}
.btn.o{background:var(--flex);color:#2A1400}.btn.g{background:var(--green)}.btn.s{background:#E3ECFB;color:#0D3C9E}.btn.r{background:#FBE5E3;color:#A8211A}.btn.k{background:#0B1F44}.btn.dim{opacity:.45}.btn.sm{min-height:42px;font-size:14.5px;border-radius:12px}
.btn:active,.plus:active,.tile:active{transform:scale(.97)}
.tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tag{font:700 11.5px/1 var(--f);padding:4px 7px;border-radius:6px;background:#EAF0FA;color:#0D3C9E}.tag.o{background:#FFE9CF;color:#7A3D00}.tag.g{background:#DDF3E4;color:#0D6630}.tag.r{background:var(--red);color:#fff}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:12px;background:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;box-shadow:inset 0 0 0 1px var(--line)}.chip.on{background:#0B1F44;color:#fff;box-shadow:none}
.note{border-radius:13px;padding:11px 13px;font-size:13.5px;background:#E3ECFB;color:#0D3C9E}.note.g{background:#DDF3E4;color:#0D6630}.note.r{background:#FBE5E3;color:#A8211A}.note.o{background:#FFEFDB;color:#7A3D00}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.inp{width:100%;min-height:48px;background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:12px 14px;font:500 15px var(--f);color:#0B1F44;outline:none;display:block}.inp:focus{border-color:var(--mat)}.inp.bad{border-color:var(--red)}textarea.inp{resize:none;min-height:70px}
.th{width:62px;height:62px;flex:none;border-radius:14px;background:#EAF0F8;display:grid;place-items:center;overflow:hidden}.th img{max-width:78%;max-height:86%;display:block;filter:drop-shadow(0 4px 5px rgba(11,31,68,.25))}.th svg{width:74%;height:74%}
.step{display:flex;align-items:center;background:#0B1F44;color:#fff;border-radius:12px;flex:none}.step button{width:34px;height:38px;font-size:19px;font-weight:700;text-align:center}.step span{min-width:24px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.plus{flex:none;width:42px;height:42px;border-radius:13px;background:var(--mat);color:#fff;display:grid;place-items:center}
/* gilamcha */
.mat{background-color:var(--mat);background-image:linear-gradient(rgba(255,255,255,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.13) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:80px 80px,80px 80px,16px 16px,16px 16px;background-position:-1px -1px;color:#fff;position:relative}
.ruler{position:absolute;left:0;right:0;bottom:0;height:13px;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.75) 0 1px,transparent 1px 40px),repeating-linear-gradient(90deg,rgba(255,255,255,.42) 0 1px,transparent 1px 8px);background-size:100% 13px,100% 6px;background-repeat:no-repeat;background-position:0 100%;pointer-events:none}
.hero{padding:2px 16px 22px;border-radius:0 0 26px 26px;overflow:hidden}
.top{display:flex;align-items:center;gap:6px;padding:2px 0 10px}
.logo{font:900 27px/1 var(--fc);letter-spacing:-.02em}.logo span{font:700 11px var(--f);opacity:.8;margin-left:5px;letter-spacing:0}
.ib{position:relative;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.14)}
.bdg{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--flex);color:#2A1400;font:800 11.5px/18px var(--f);text-align:center;padding:0 4px}
.find{display:flex;align-items:center;gap:10px;width:100%;height:48px;border-radius:15px;background:#fff;color:#5E6B82;padding:0 14px;font-size:15px;font-weight:500}
.find input{flex:1;min-width:0;border:0;outline:none;background:none;font:500 15px var(--f);color:#0B1F44}
.mdl{flex:none;min-height:38px;padding:0 13px;border-radius:12px;background:rgba(255,255,255,.14);font-weight:700;font-size:14px;color:#fff}.mdl.on{background:#fff;color:#0D3C9E}
.ask{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:14px 0 8px}.ask b{font:800 23px/1.05 var(--fc)}.ask span{font-size:13px;opacity:.85;white-space:nowrap}
.bench{position:relative;height:300px;margin:4px -4px 0}
.bench svg.ex{position:absolute;left:0;top:0;width:210px;height:300px;overflow:visible}
.bench .ly{cursor:pointer}
.bench .ly.off{opacity:.28}
.lb{position:absolute;left:202px;right:0;height:46px;padding:0 10px;border-radius:12px;background:rgba(8,32,92,.55);display:flex;flex-direction:column;justify-content:center;color:#fff}
.lb b{font:800 16px/1.1 var(--fc)}.lb small{font-size:12.5px;opacity:.92;font-variant-numeric:tabular-nums;white-space:nowrap}.lb.off{opacity:.45}
.lb.sel{background:var(--flex);color:#2A1400}
/* jonli buyurtma */
.live{display:flex;gap:12px;align-items:center;background:#0B1F44;color:#fff;border-radius:18px;padding:12px 14px;width:100%}.live .ic{color:#FFB869}.live b{display:block;font:800 17px/1.15 var(--fc)}.live small{font-size:13px;opacity:.85}
.seg4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:7px}.seg4 i{height:5px;border-radius:3px;background:rgba(255,255,255,.22)}.seg4 i.d{background:#FFB869}.seg4 i.c{background:#FFB869;animation:pulse 1.4s infinite}
/* chipta — aksiya */
.ticket{position:relative;display:flex;align-items:stretch;width:100%;background:#FFE3C2;color:#3A1C00;border-radius:16px;overflow:hidden}
.ticket .l{flex:1;min-width:0;padding:13px 14px}.ticket .l b{font:800 17px/1.15 var(--fc);display:block}.ticket .r{width:112px;flex:none;background:var(--flex);display:grid;place-content:center;text-align:center;border-left:2px dashed rgba(58,28,0,.45);padding:8px}
.ticket .r b{font:800 26px/1 var(--fc)}.ticket .r small{font-size:12px;font-weight:700}
/* toifa plitkalari */
.bento{display:grid;grid-template-columns:1.25fr 1fr;grid-auto-rows:92px;gap:10px}
.tile{position:relative;border-radius:18px;background:#fff;padding:12px 13px;overflow:hidden;display:block}.tile b{font:800 18px/1.1 var(--fc);display:block;position:relative;z-index:1}.tile small{color:var(--muted);font-size:12.5px;position:relative;z-index:1}
.tile:first-child{grid-row:span 2;background:#0B1F44;color:#fff}.tile:first-child small{color:#AFC1E6}.tile img{position:absolute;right:-10px;bottom:-16px;height:132px;max-width:none;transform:rotate(6deg)}.tile svg{position:absolute;right:4px;bottom:2px;width:58px;height:58px}
/* mahsulot */
.card{flex:none;width:158px;background:#fff;border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:7px;text-align:left;cursor:pointer}
.card .pic{position:relative;height:122px;border-radius:13px;background:#EAF0F8;display:grid;place-items:center}.card .pic img{max-height:112px;filter:drop-shadow(0 8px 8px rgba(11,31,68,.28))}.card .pic svg{width:74px;height:74px}.card .pic .tags{position:absolute;left:7px;top:7px}
.nm{font:700 15.5px/1.2 var(--fc);overflow-wrap:anywhere}.card .nm{min-height:37px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .ft{display:flex;justify-content:space-between;align-items:center;gap:4px;min-height:42px}
.card .step button{width:27px}.card .step span{min-width:18px}
.wh{font-size:12.5px;font-weight:700;color:var(--green);white-space:nowrap}
.rowp{display:flex;gap:11px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}.rowp:last-child{border:0}.rowp .m{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
/* katalog: ikki ustun */
.two{flex:1;min-height:0;display:flex}.rail{width:84px;flex:none;overflow-y:auto;scrollbar-width:none;background:#fff;padding:6px 0 100px}
.rail button{width:100%;padding:11px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;font:700 12.5px/1.15 var(--f);color:var(--muted);text-align:center}.rail button span{width:46px;height:46px;border-radius:14px;background:#F2F5FA;display:grid;place-items:center}.rail svg.a{width:32px;height:32px}.rail button.on{color:#0B1F44}.rail button.on span{background:#CFE0FC}
.plist{flex:1;min-width:0;padding:10px 14px 108px}
/* savat tugmasi o'rtada */
.tabs{position:absolute;left:10px;right:10px;bottom:10px;z-index:8;height:66px;border-radius:24px;background:#fff;box-shadow:0 12px 30px -10px rgba(11,31,68,.45);display:grid;grid-template-columns:1fr 1fr 78px 1fr 1fr;align-items:center}
.tabs>button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:#7A869C}.tabs>button.on{color:var(--mat)}.tabs .dot{position:absolute;top:-2px;right:calc(50% - 16px);width:9px;height:9px;border-radius:50%;background:var(--flex);box-shadow:0 0 0 2px #fff}
.tabs .cart{height:74px;margin-top:-22px;border-radius:24px;background:#0B1F44;color:#fff!important;justify-content:center;font-size:12px;font-variant-numeric:tabular-nums}.tabs .cart.full{background:var(--flex);color:#2A1400!important}.tabs .cart .bdg{background:#0B1F44;color:#fff;top:7px;right:13px}
.tabs .cart.bump{animation:bump .4s}
/* pastki varaq */
.dimr{position:absolute;inset:0;background:rgba(7,18,46,.5);z-index:11;width:100%}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:66%;z-index:12;background:#fff;border-radius:26px 26px 0 0;display:flex;flex-direction:column;box-shadow:0 -20px 40px -16px rgba(7,18,46,.4)}
.sheet header{display:flex;align-items:center;gap:10px;padding:16px 16px 8px}.sheet header div{flex:1}.sheet header b{font:800 22px/1.1 var(--fc);display:block}.sheet header small{color:var(--muted);font-size:13.5px}
.sheet .bd{overflow-y:auto;padding:0 16px 20px;scrollbar-width:none}.x{width:38px;height:38px;border-radius:12px;background:#EEF2F8;display:grid;place-items:center;flex:none}
/* sarlavha paneli */
.bar{flex:none;display:flex;align-items:center;gap:10px;padding:2px 14px 8px}.bar b{flex:1;font:800 19px/1.15 var(--fc);min-width:0}.bk{width:40px;height:40px;border-radius:13px;background:#fff;display:grid;place-items:center;flex:none}.mat .bk{background:rgba(255,255,255,.16)}
.stage{padding:0 16px 24px;border-radius:0 0 26px 26px;overflow:hidden}.stage .im{height:216px;display:grid;place-items:center}.stage .im img{max-height:212px;filter:drop-shadow(0 18px 18px rgba(4,18,58,.55))}.stage .im svg{width:150px;height:150px;filter:drop-shadow(0 16px 14px rgba(4,18,58,.45))}
/* narx zinasi */
.lad{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}.lad div{border-radius:15px;background:#fff;padding:11px 13px;box-shadow:inset 0 0 0 1.5px var(--line)}.lad div:last-child{padding-top:24px}.lad .on{box-shadow:inset 0 0 0 2.5px var(--mat)}.lad .w.on{box-shadow:inset 0 0 0 2.5px var(--green);background:#F0FAF3}.lad small{display:block;color:var(--muted);font-size:13px;font-weight:700;margin-bottom:4px}.lad .price{font-size:23px}
.buy{position:absolute;left:0;right:0;bottom:0;z-index:8;background:#fff;padding:12px 16px 18px;display:flex;gap:10px;align-items:center;border-radius:24px 24px 0 0;box-shadow:0 -12px 30px -14px rgba(11,31,68,.35)}.buy .step button{width:40px;height:50px}.buy .step{border-radius:15px}
/* optom o'lchagich */
.gauge{border-radius:18px;padding:14px 14px 22px;overflow:hidden}.gauge b{font:800 18px/1.15 var(--fc);display:block}.gauge small{font-size:13px;opacity:.92}.gauge .t{height:10px;border-radius:5px;background:rgba(255,255,255,.22);margin-top:10px;overflow:hidden}.gauge .t i{display:block;height:100%;border-radius:5px;background:#FFB869;transition:width .35s}
.nudge{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border-radius:11px;background:#DDF3E4;color:#0D6630;font-weight:700;font-size:13px;padding:8px 11px;margin-top:8px}
.rcpt{background:#fff;padding:14px 16px 20px;border-radius:18px 18px 0 0;-webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%}.rcpt .sum{display:flex;justify-content:space-between;align-items:baseline;padding-top:8px;font-weight:700}.rcpt .sum .price{font-size:25px}
/* rasmiylashtirish */
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}.opt{border-radius:16px;background:#fff;padding:13px;box-shadow:inset 0 0 0 1.5px var(--line);width:100%;display:block}.opt b{display:block;font-size:15px;font-weight:700}.opt small{color:var(--muted);font-size:13px}.opt.on{box-shadow:inset 0 0 0 2.5px var(--mat);background:#EDF3FE}.opt .ic{margin-bottom:6px;color:var(--mat)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.slots button{min-height:42px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);font-weight:700;font-size:13.5px;text-align:center;font-variant-numeric:tabular-nums}.slots button.on{background:#0B1F44;color:#fff;box-shadow:none}
/* kuzatish */
.trk{padding:4px 16px 26px;border-radius:0 0 26px 26px;overflow:hidden}.trk h2{font:800 27px/1.1 var(--fc);margin:8px 0 2px}.trk p{margin:0;font-size:14px;opacity:.92}
.way{position:relative;height:64px;margin:14px 8px 0}.way .ln{position:absolute;left:0;right:0;top:34px;height:4px;border-radius:2px;background:rgba(255,255,255,.25)}.way .ln i{display:block;height:100%;border-radius:2px;background:#FFB869;transition:width .7s}.way .sn{position:absolute;top:28px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#0D3C9E;box-shadow:inset 0 0 0 3px rgba(255,255,255,.55)}.way .sn.d{background:#FFB869;box-shadow:none}.way .go{position:absolute;top:0;margin-left:-23px;width:46px;height:30px;border-radius:10px;background:#fff;color:#0D3C9E;display:grid;place-items:center;transition:left .7s;box-shadow:0 6px 14px -4px rgba(0,0,0,.45)}
.waylb{display:flex;justify-content:space-between;font-size:12px;font-weight:700;opacity:.95}
.shipg{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.shipg svg{width:100%;aspect-ratio:1;border-radius:13px;display:block}
.ord{background:#fff;border-radius:18px;padding:13px 14px;display:flex;flex-direction:column;gap:7px;width:100%;cursor:pointer}.ord .r{display:flex;justify-content:space-between;align-items:center;gap:8px}.ord small{color:var(--muted);font-size:13.5px}.ord .id{font:800 18px/1.1 var(--fc)}
.st{display:inline-flex;border-radius:9px;padding:5px 9px;font-size:12.5px;font-weight:700;white-space:nowrap}.st.s0{background:#DCE8FD;color:#0D3C9E}.st.s1{background:#FFE9CF;color:#7A3D00}.st.s2{background:#DDF3E4;color:#0D6630}.st.s3{background:#E8ECF3;color:#3A4A6B}.st.sx{background:#FBE5E3;color:#A8211A}
.way .sn{padding:0}
.li{display:flex;align-items:center;gap:12px;min-height:54px;width:100%;border-bottom:1px solid var(--line);font-weight:600;font-size:15px}.li:last-child{border:0}.li .v{margin-left:auto;color:var(--muted);font-size:14px;font-weight:500}
.nrow{display:flex;gap:10px;align-items:center;background:#fff;border-radius:16px;padding:12px 14px;width:100%}.nrow.unread{background:#E3ECFB}
/* admin */
.ahd{background:#0B1F44;color:#fff;padding:0 16px 18px;border-radius:0 0 26px 26px}.ahd .bar{padding:2px 0 8px}.ahd .bar small{display:block;font:500 12.5px var(--f);opacity:.75}.ahd .bk{background:rgba(255,255,255,.12)}
.ahd .big{font:800 38px/1 var(--fc);font-variant-numeric:tabular-nums}.ahd .sub{display:flex;gap:14px;font-size:14px;margin-top:5px}.ahd .sub b{color:#7FE0A2}
.hours{display:flex;align-items:flex-end;gap:4px;height:58px;margin-top:14px}.hours i{flex:1;border-radius:4px 4px 1px 1px;background:#2F56A8}.hours i.n{background:#FFB869}.hours i.f{background:rgba(255,255,255,.1)}
.hl{display:flex;justify-content:space-between;font-size:11.5px;opacity:.75;margin-top:4px}
.pipe{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.pipe button{border-radius:15px;background:#fff;padding:10px 4px;text-align:center}.pipe b{display:block;font:800 24px/1 var(--fc)}.pipe small{font-size:12px;color:var(--muted);font-weight:700}.pipe .hot{background:var(--mat);color:#fff}.pipe .hot small{color:#DCE8FD}.pipe .on{box-shadow:inset 0 0 0 2.5px #0B1F44}
.ord.unseen{box-shadow:0 0 0 2.5px var(--mat)}.ord .its{font-size:13.5px;color:#3A4A6B;line-height:1.35}
.atabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);padding:8px 0 12px}.atabs button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:#7A869C}.atabs .on{color:var(--mat)}.atabs .bdg{right:calc(50% - 20px)}
.apad{padding:14px 16px 18px;display:flex;flex-direction:column;gap:14px}.foot{flex:none;background:#fff;border-top:1px solid var(--line);padding:10px 16px 16px}
.seg{display:flex;background:#E2E8F2;border-radius:13px;padding:3px}.seg button{flex:1;min-height:40px;border-radius:11px;font-weight:700;font-size:14px;text-align:center;color:var(--muted)}.seg .on{background:#fff;color:#0B1F44}
.pts{display:flex;gap:9px;flex-wrap:wrap}.pt{position:relative;width:88px;height:88px;border-radius:15px}.pt svg.sp{width:100%;height:100%;border-radius:15px;display:block}.pt .del{position:absolute;top:-7px;right:-7px;width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800}.shot{border:2px dashed var(--flex);background:#FFF3E3;color:#7A3D00;font-weight:700;font-size:13px;display:grid;place-content:center;justify-items:center;gap:4px;text-align:center}
.tgl{width:52px;height:32px;border-radius:16px;background:#C5CFDE;position:relative;flex:none;transition:background .2s}.tgl::after{content:'';position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}.tgl.on{background:var(--green)}.tgl.on::after{left:24px}
.chat{flex:1;background:#C9DDF0;padding:12px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;scrollbar-width:none}.msg{background:#fff;border-radius:16px 16px 16px 5px;padding:11px 13px;font-size:13.5px;line-height:1.45;max-width:94%;white-space:pre-line;overflow-wrap:anywhere}.msg time{display:block;text-align:right;font-size:11.5px;color:#7A869C}.kb{display:grid;grid-template-columns:1fr 1fr;gap:5px;max-width:94%}.kb button{background:rgba(255,255,255,.86);border-radius:10px;min-height:40px;text-align:center;font-size:13.5px;font-weight:700;color:#0D3C9E}.kb .w{grid-column:1/-1}
.week{display:flex;align-items:flex-end;gap:8px;height:128px}.week div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font-size:12px;font-weight:700;color:var(--muted)}.week i{width:100%;border-radius:7px 7px 2px 2px;background:#9DB8E8}.week .n i{background:var(--flex)}.week .f i{background:#E2E8F2}
/* xabarlar qatlami */
.ovl{position:absolute;inset:10px;border-radius:38px;overflow:hidden;pointer-events:none;z-index:30}.pushes{position:absolute;left:8px;right:8px;top:36px;display:flex;flex-direction:column;gap:6px}
.push{pointer-events:auto;display:flex;gap:10px;width:100%;background:rgba(255,255,255,.98);color:#0B1F44;border-radius:20px;padding:11px 13px;box-shadow:0 14px 34px -8px rgba(7,18,46,.5)}.push.tg{background:#17212F;color:#fff}
.push .pi{width:38px;height:38px;border-radius:11px;background:var(--mat);color:#fff;font:900 13px/38px var(--fc);text-align:center;flex:none}.push.tg .pi{border-radius:50%;background:#2AABEE}.push .pt2{flex:1;min-width:0}.push b{font-size:14px;display:flex;justify-content:space-between;gap:6px;line-height:1.3}.push b small{font-weight:500;opacity:.65;font-size:12px}.push .pt2>span{font-size:13.5px;line-height:1.35;display:block}
.snack{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);width:max-content;max-width:88%;background:#0B1F44;color:#fff;border-radius:13px;padding:10px 15px;font-size:13.5px;font-weight:600;text-align:center;box-shadow:0 10px 24px -6px rgba(0,0,0,.45)}.snack.err{background:var(--red)}
@media (prefers-reduced-motion:no-preference){
  .push{animation:pin .42s cubic-bezier(.2,.9,.3,1.12)}.push.out{animation:pout .3s forwards}
  .screen.fresh .pad,.screen.fresh .apad{animation:up .25s ease}
  .screen.boom .ly{animation:boom .7s cubic-bezier(.2,.9,.25,1.08) backwards}.screen.boom .lb,.screen.boom .ld{animation:fin .35s .4s backwards}
  .sheet.in{animation:sup .28s cubic-bezier(.2,.8,.3,1)}
  .ord.unseen{animation:glow 1.3s 2}
}
@keyframes pin{from{transform:translateY(-130%)}}@keyframes pout{to{transform:translateY(-130%)}}@keyframes up{from{transform:translateY(8px)}}
@keyframes boom{from{transform:translate(0,var(--from))}}@keyframes fin{from{opacity:0}}@keyframes sup{from{transform:translateY(60%)}}@keyframes bump{40%{transform:scale(1.12)}}@keyframes pulse{50%{opacity:.35}}@keyframes glow{50%{box-shadow:0 0 0 7px #BFD6FF}}
.lad .price small{display:inline;margin:0;color:inherit}
.sbar.ink,.sbar.mat{margin-bottom:-1px;position:relative}
.two .plist .th{width:52px;height:52px}.two .plist .rowp{gap:9px}.two .plist .step button{width:27px}.two .plist .step span{min-width:18px}.two .plist .nm{font-size:15px}
.tile{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start}
.way{margin:16px 20px 0}.waylb{margin-top:2px}
.tile small{max-width:68%}.tile svg{width:46px;height:46px;right:10px;bottom:8px}
@keyframes fin{from{opacity:.35}}

function bench(){const N=LAYERS.length,dy=49,m=C.model;let g='',lb='';
  LAYERS.map((l,i)=>({k:l[0],t:l[1],i})).reverse().forEach(({k,i})=>{const L=forModel(m,k),y=10+i*dy,sel=C.sheet===k;
    g+=`<g class="ly ${L.length?'':'off'}" style="--from:${(2-i)*dy*.85}px" ${L.length?`data-part="${k}"`:''}><g transform="translate(${sel?14:0} 0)"><g transform="matrix(.64 .2 -.5 .33 108 ${y+7})"><rect width="100" height="200" rx="16" fill="#061C52" opacity=".75"/></g><g transform="matrix(.64 .2 -.5 .33 108 ${y})">${LAY[k]}${sel?'<rect width="100" height="200" rx="16" fill="none" stroke="#F08A24" stroke-width="7"/>':''}</g></g></g>`;});
  LAYERS.forEach(([k,t],i)=>{const L=forModel(m,k),y=10+i*dy,min=L.length?Math.min(...L.map(eff)):0;
    g+=`<path class="ld" d="M${176+(C.sheet===k?14:0)} ${y+22}H202" stroke="#fff" stroke-opacity="${L.length?.8:.3}" stroke-width="1.500" fill="none"/><circle class="ld" cx="${176+(C.sheet===k?14:0)}" cy="${y+22}" r="3" fill="${L.length?'#F08A24':'#7F9AD0'}"/>`;
    lb+=`<button class="lb ${L.length?'':'off'} ${C.sheet===k?'sel':''}" style="top:${y-1}px" ${L.length?`data-part="${k}"`:'disabled'}><b>${t}</b><small>${L.length?`${num(min)} dan`:"hozir yo'q"}</small></button>`;});
  return `<div class="bench"><svg class="ex" viewBox="0 0 210 300" aria-hidden="true">${g}</svg>${lb}</div>`;}
function sheet(){if(!C.sheet)return '';const t=LAYERS.find(l=>l[0]===C.sheet)[1],L=forModel(C.model,C.sheet);
  return `<button class="dimr" data-closesheet aria-label="Yopish"></button><section class="sheet"><header><div><b>${t}</b><small>${C.model} · ${L.length} xil, arzonidan</small></div><button class="x" data-closesheet aria-label="Yopish">${ic('x',20)}</button></header><div class="bd" data-sc="sheet">${L.length?L.map(p=>prow(p.id)).join(''):'<div class="empty">Hozir sotuvda yo\'q</div>'}${cartCount()?`<button class="btn o" data-tab="c-cart" style="margin-top:12px">Savat · ${fm(lines(S.cart).total)}</button>`:''}</div></section>`;}
const STEPS=o=>o.delivery?['Qabul qilindi',"Yig'ilmoqda","Yo'lda",'Yetkazildi']:['Qabul qilindi',"Yig'ilmoqda",'Tayyor','Olib ketildi'];
const HEAD=o=>o.status<0?'Buyurtma bekor qilindi':o.delivery?["Do'konga yuborildi","Buyurtma yig'ilmoqda","Mashina yo'lga chiqdi",'Yetkazildi'][o.status]:["Do'konga yuborildi","Buyurtma yig'ilmoqda",'Tayyor, kelib oling','Olib ketildi'][o.status];
const seg4=s=>`<div class="seg4">${[0,1,2,3].map(k=>`<i class="${k<s?'d':k===s?'c':''}"></i>`).join('')}</div>`;

const CS={
'c-home':()=>{const promos=Object.values(P).filter(p=>p.promo&&!p.hidden),live=activeMine(),vc=visCats();return `${sbar('mat')}<div class="scroll"><div class="mat hero">

  <div class="hrow"><h2 class="h">Ko'p olinadi</h2><button data-cat="ekran" data-go="c-catalog">Hammasi</button></div>
  <div class="hx" data-scx="pop">${POP.filter(vis).map(pcard).join('')}</div>
  <h2 class="h">Toifalar</h2>
  <div class="bento">${vc.slice(0,5).map((c,i)=>`<button class="tile" data-go="c-catalog" data-cat="${c}"><b>${CAT[c]}</b><small>${CSUB[c]}</small>${i===0?`<img src="${IMG[1]}" alt="">`:art(c)}</button>`).join('')}</div>
  <div class="box" style="background:#0B1F44;color:#fff"><div><h2 class="h">iPhone XR ta'mir to'plami</h2><span style="font-size:14px;opacity:.85">Batareya, pastki shleyf, old kamera, krishka</span></div><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span class="price" style="font-size:22px">${num(lines(Object.fromEntries(KIT.filter(vis).map(id=>[id,1]))).total)} <small>so'm</small></span><button class="btn o sm" style="width:auto" data-bundle>To'plamni olish</button></div></div>
  </div></div>${ctab('c-home')}${sheet()}`;},

'c-catalog':()=>{const ids=search(C.q,C.q?'':C.cat,C.tech),techs=C.q||C.cat==='ekran'?['IPS','Incell']:[];return `${sbar()}<div class="bar" style="padding-bottom:10px"><div class="find" style="box-shadow:inset 0 0 0 1.5px var(--line)">${ic('search',20)}<input id="c-q" data-f="c-q" value="${esc(C.q)}" placeholder="Masalan: ayfon xr batareya" aria-label="Qidirish">${C.q?`<button data-clearq aria-label="Tozalash">${ic('x',19)}</button>`:''}</div></div>
  <div class="two">${C.q?'':`<nav class="rail" data-sc="rail">${visCats().map(c=>`<button class="${c===C.cat?'on':''}" data-cat="${c}"><span>${art(c)}</span>${CAT[c]}</button>`).join('')}</nav>`}

  ${C.q?`<div style="color:var(--muted);font-size:13.5px;padding-top:4px">${ids.length} ta topildi</div>`:''}
  ${ids.length?ids.map(prow).join(''):`<div class="empty">Bunday tovar topilmadi. Modelni boshqacha yozib ko'ring, masalan "note 11 ekran".</div>`}</div></div>${ctab('c-catalog')}`;},

'c-product':()=>{const p=P[C.pid];if(p.hidden)return `${sbar()}${bar('Tovar')}<div class="scroll"><div class="pad"><div class="box empty">Bu tovar hozir sotuvda yo'q.</div></div></div>`;
  const q=S.cart[C.pid]||0,n=Math.max(q,1),wOn=!p.promo&&p.w<p.price&&n>=p.wq,save=(p.price-p.w)*p.wq,unit=p.promo||(wOn?p.w:p.price),same=p.models.flatMap(m=>forModel(m,p.cat)).filter(x=>x.id!==p.id).slice(0,4);
  return `${sbar('mat')}<div class="scroll"><div class="mat stage"><div class="bar" style="padding:2px 0 4px"><button class="bk" data-back aria-label="Orqaga">${ic('left',21)}</button><b>${CAT[p.cat]}</b><button class="ib" aria-label="Sevimlilar" data-fav="${p.id}">${ic('heart')}</button></div><div class="im">${pimg(p.id)}</div><div class="ruler"></div></div>
  <div class="pad" style="padding-bottom:120px">

  ${p.promo?`<div class="box" style="background:#FFE3C2"><div style="display:flex;align-items:baseline;gap:10px"><span class="price red" style="font-size:30px">${num(p.promo)} <small>so'm</small></span><s style="font-size:17px">${num(p.price)}</s></div><span style="font-weight:700;color:#7A3D00">Aksiya narxi 30-noyabrgacha</span></div>`
   :p.w<p.price?`<div><div class="lad"><div class="${wOn?'':'on'}"><small>1–${p.wq-1} dona</small>${pr(p.price)}</div><div class="w ${wOn?'on':''}"><small>${p.wq} donadan</small><span style="color:var(--green)">${pr(p.w)}</span></div></div>${wOn?`<div class="note g" style="margin-top:8px"><b>${fm((p.price-p.w)*n)}</b> tejadingiz</div>`:`<button class="nudge" data-setq="${p.id}:${p.wq}"><span>${p.wq} ta olsangiz ${fm(save)} tejaysiz</span><b>${p.wq} ta qilish</b></button>`}</div>`
   :`<div class="lad" style="grid-template-columns:1fr"><div class="on" style="padding-top:11px"><small>Narxi</small>${pr(p.price)}</div></div>`}
  ${p.models.length?`<div class="box"><b>Mos modellar</b><div class="tags">${(p.cat==='ekran'?nameOf(p).t.split('/'):p.models).map(x=>`<span class="tag" style="font-size:13px;padding:7px 10px">${x.trim()}</span>`).join('')}</div></div>`:''}
  <div class="box">${[['MSD, 1-filial','Mavjud'],['Store Pixel, 2-filial','Mavjud'],['Kafolat','14 kun'],['Shtrix-kod','20000001'+String(p.id).padStart(4,'0')]].map(([k,v])=>`<div class="kv"><span>${k}</span><b ${v==='Mavjud'?'style="color:var(--green)"':''}>${v}</b></div>`).join('')}</div>
  ${same.length?`<h2 class="h">Shu modelga boshqa variantlar</h2><div class="box" style="padding:4px 14px">${same.map(x=>prow(x.id)).join('')}</div>`:''}
  </div></div><div class="buy">${q?`${stepper(p.id,q)}<button class="btn o" data-tab="c-cart">Savat · ${num(unit*q)}</button>`:`<button class="btn" data-padd="${p.id}">Savatga · ${fm(unit)}</button>`}</div>`;},

'c-cart':()=>{const {L,retail,total,allW}=lines(S.cart),LIM=1500000,more=L.reduce((a,l)=>a+(l.unit-Math.min(l.unit,l.promo?l.unit:l.p.w))*l.q,0);return `${sbar()}<div class="bar"><b style="font-size:26px;padding-left:2px">Savat</b></div><div class="scroll"><div class="pad" style="padding-top:4px;padding-bottom:${L.length?180:110}px">

  <div class="rcpt">${retail>total?`<div class="kv"><span>Chakana narxda</span><b>${num(retail)}</b></div><div class="kv"><span>Tejaldi</span><b style="color:var(--green)">−${num(retail-total)}</b></div>`:''}<div class="sum"><span>Jami</span>${pr(total)}</div></div>`
  :`<div class="box" style="align-items:center;text-align:center;padding:36px 20px;gap:14px"><div class="th" style="width:88px;height:88px">${art('batareya')}</div><b class="h">Savat bo'sh</b><span style="color:var(--muted)">Ish stolida modelni tanlang va kerakli qismni bosing.</span><button class="btn" data-tab="c-home">Ish stoliga o'tish</button></div>`}
  </div></div>${L.length?`<div class="buy" style="bottom:88px;border-radius:20px;left:10px;right:10px;padding:8px"><button class="btn" data-go="c-checkout">Rasmiylashtirish · ${fm(total)}</button></div>`:''}${ctab('c-cart')}`;},

  <div class="box">${[[d?'Yetkazish':'Olib ketish',`${dayTxt(o)}, ${o.slot}`],...(d?[['Manzil',esc(o.address)]]:[]),['Filial',BR[o.branch].n],["To'lov",d?'Yetkazilganda':"Do'konda"]].map(([k,v])=>`<div class="kv"><span>${k}</span><b>${v}</b></div>`).join('')}</div>

  const atBottom=!chat||chat.scrollHeight-chat.scrollTop-chat.clientHeight<40;
  el.innerHTML=(side==='c'?CS:AS)[x.r]();
  el.classList.toggle('fresh',last[side]!==key);if(side==='c'){el.classList.toggle('boom',x.r==='c-home'&&(last[side]!==key||boomM!==C.model)&&!C.sheet);boomM=C.model;const sh=el.querySelector('.sheet');if(sh&&!hadSheet)sh.classList.add('in');}if(last[side]===key)el.querySelectorAll('[data-sc],[data-scx],.hx').forEach((n,i)=>{const k=keep[(n.dataset.sc||n.dataset.scx||'h')+i];if(k){n.scrollTop=k[0];n.scrollLeft=k[1];}});last[side]=key;
  const n=el.querySelector('.scroll');if(n)n.scrollTop=top;
  const ch=el.querySelector('.chat');if(ch&&atBottom)ch.scrollTop=ch.scrollHeight;
  if(f){const i=el.querySelector(`[data-f="${f}"]`);if(i){i.focus();try{const p=Math.min(sel,i.value.length);i.setSelectionRange(p,p);}catch(e){}}}
}
function paintAll(){paint('c');paint('a');document.querySelectorAll('[data-sw]').forEach(b=>{const s=b.dataset.sw;b.classList.toggle('on',side()===s);b.querySelector('i').hidden=!S.sw[s];});}
const mobile=()=>matchMedia('(max-width:819px)').matches;
const side=()=>document.body.classList.contains('show-a')?'a':'c';
function setSide(s){document.body.classList.toggle('show-a',s==='a');S.sw[s]=false;document.getElementById('gt').classList.remove('on');paintAll();}

function snack(sd,text,err){const o=document.querySelector(`#${sd==='c'?'co':'ao'}`);o.querySelector('.snack')?.remove();const d=document.createElement('div');d.className='snack'+(err?' err':'');d.textContent=text;o.appendChild(d);setTimeout(()=>d.remove(),2600);}
function push(sd,{title,text,to}){
  const box=document.querySelector(`#${sd==='c'?'co':'ao'} .pushes`);const b=document.createElement('button');b.className='push'+(sd==='a'?' tg':'');
  b.innerHTML=`<span class="pi">${sd==='a'?'✈':'MSD'}</span><span class="pt2"><b>${title}<small>hozir</small></b><span></span></span>`;b.querySelector('.pt2>span').textContent=text;
  const open=()=>{if(mobile()&&side()!==sd)setSide(sd);if(to){const x=X(sd);if(!(x.r===to.r&&x.oid===to.oid))nav(sd,to.r,to);}b.remove();};
  b.onclick=open;box.prepend(b);while(box.children.length>2)box.lastChild.remove();
  setTimeout(()=>{b.classList.add('out');setTimeout(()=>b.remove(),320);},5000);
  if(mobile()&&side()!==sd){S.sw[sd]=true;const g=document.getElementById('gt');g.innerHTML=`<span>${sd==='a'?'Admin panelga':'Mijoz ilovasiga'}: ${text}</span><b>Ko'rish ›</b>`;g.onclick=open;g.classList.add('on');clearTimeout(g._t);g._t=setTimeout(()=>g.classList.remove('on'),6000);}
}

/* ===== amallar ===== */
function setStatus(o,s){
  if(!NEXT[o.status].includes(s))return snack('a',"Bu holatga o'tkazib bo'lmaydi",1);
  if(o.delivery&&s===2&&!o.photos.length)return snack('a','Avval mashinaga yuklash rasmini yuklang',1);
  o.status=s;o.seen=true;
  if(o.mine){const [t,x]=custMsg(o,s);S.notifs.unshift({t,x,oid:o.id,time:now(),unread:true});push('c',{title:t,text:x,to:{r:'c-order',oid:o.id}});}
  snack('a',s===-1?'Buyurtma bekor qilindi':s===3?"Yakunlandi · hisobotga qo'shildi":`Holat: ${STN(o)}${o.mine?' · mijozga xabar ketdi':''}`);
  paintAll();
}
function placeOrder(){
  const {L}=lines(S.cart);if(!L.length)return;
  if(S.delivery&&S.address.trim().length<5)return snack('c','Yetkazish manzilini yozing',1);
  const o=mkOrder({id:S.next++,name:ME.name,phone:ME.phone,mine:true,delivery:S.delivery,address:S.delivery?S.address.trim():'',branch:S.branch,day:S.day,slot:S.slot,items:{...S.cart},status:0,seen:false});
  S.orders.push(o);S.cart={};S.bot.push({k:'ord',oid:o.id,time:o.time});
  C.stack=[];C.r='c-order';C.oid=o.id;enter('c');
  snack('c',"Buyurtma yuborildi. Do'kon tasdiqlashini kuting.");
  push('a',{title:'MSD Admin bot',text:`Yangi buyurtma #${o.id} · ${o.name} · ${fm(o.total)}${o.delivery?', yetkazish':''}`,to:{r:'a-order',oid:o.id}});
  paintAll();
}
function addCart(id,d){S.cart[id]=Math.max(0,(S.cart[id]||0)+d);if(!S.cart[id])delete S.cart[id];}

function clickC(b,D){
  if(D.add){addCart(+D.add,1);return paintAll();}
  if(D.model){C.model=D.model;return paint('c');}
  if(D.part){C.sheet=D.part;return paint('c');}
  if(D.closesheet!=null){C.sheet=null;return paint('c');}
  if(D.setq){const [id,n]=D.setq.split(':').map(Number);S.cart[id]=n;return paintAll();}
  if(D.srch!=null){C.q='';C.focus=1;nav('c','c-catalog');document.getElementById('c-q')?.focus();return;}
  if(D.tech!=null){C.tech=D.tech;return paint('c');}
  if(D.fav){snack('c',"Sevimlilarga qo'shildi");return;}
  if(D.padd){addCart(+D.padd,1);return paintAll();}
  if(D.q){const [id,d]=D.q.split(':');addCart(+id,+d);return paintAll();}
  if(D.back!=null)return back('c');
  if(D.tab)return tab('c',D.tab);
  if(D.go){if(D.cat){C.cat=D.cat;C.tech='';C.q='';}if(D.q!=null&&D.go==='c-catalog')C.q='';return nav('c',D.go,{pid:D.pid&&+D.pid,oid:D.oid&&+D.oid});}
  if(D.cat){C.cat=D.cat;C.tech='';return paint('c');}
  if(D.clearq!=null){C.q='';return paint('c');}
  if(D.del!=null){S.delivery=D.del==='1';return paint('c');}
  if(D.br){S.branch=D.br;return paint('c');}
  if(D.day!=null){S.day=+D.day;return paint('c');}
  if(D.slot){S.slot=D.slot;return paint('c');}
  if(b.hasAttribute('data-place'))return placeOrder();
  if(b.hasAttribute('data-bundle')){KIT.filter(vis).forEach(id=>addCart(id,1));snack('c',"To'plam savatga qo'shildi");return paintAll();}
  if(D.ccancel){const o=ord(+D.ccancel);if(C.confirm!==o.id){C.confirm=o.id;return paint('c');}
    if(o.status>=2)return snack('c',"Buyurtma tayyor — bekor qilish uchun do'konga qo'ng'iroq qiling",1);
    o.status=-1;C.confirm=null;S.bot.push({k:'txt',time:now(),text:`❌ <b>Mijoz buyurtmani bekor qildi</b> · #${o.id}\n${o.name}, ${o.phone}`});
    snack('c','Buyurtma bekor qilindi');push('a',{title:'MSD Admin bot',text:`Mijoz #${o.id} buyurtmani bekor qildi`,to:{r:'a-order',oid:o.id}});return paintAll();}
  if(D.reorder){ord(+D.reorder).items.forEach(i=>{if(vis(i.id))addCart(i.id,i.q);});snack('c',"Mahsulotlar savatga qo'shildi");return tab('c','c-cart');}
}
function clickA(b,D){
  if(D.back!=null)return back('a');
  if(D.tab)return tab('a',D.tab);
  if(D.go)return nav('a',D.go,{pid:D.pid&&+D.pid,oid:D.oid&&+D.oid});
  if(D.qs){const [id,s]=D.qs.split(':').map(Number);return setStatus(ord(id),s);}
  if(D.grp){A.grp=D.grp;if(A.r!=='a-orders')return nav('a','a-orders');return paint('a');}
  if(D.abr){A.br=D.abr;return paint('a');}
  if(D.per){A.per=D.per;return paint('a');}
  if(D.st!=null)return setStatus(ord(A.oid),+D.st);
  if(D.bot){const [id,s]=D.bot.split(':').map(Number);return setStatus(ord(id),s);}
  if(D.botopen)return nav('a','a-order',{oid:+D.botopen});
  if(b.hasAttribute('data-photo')){const o=ord(A.oid);o.photos.push((o.photos.length+o.id)%6);snack('a',o.mine?"Rasm yuklandi · mijoz ilovasida ko'rinadi":'Rasm yuklandi');return paintAll();}
  if(D.rmph!=null){ord(A.oid).photos.splice(+D.rmph,1);return paintAll();}
  if(b.hasAttribute('data-addr')){A.addr=ord(A.oid).address||'';return paint('a');}
  if(b.hasAttribute('data-addrno')){A.addr=null;return paint('a');}
  if(b.hasAttribute('data-addrsave')){if(A.addr.trim().length<5)return snack('a','Manzilni to\'liq yozing',1);const o=ord(A.oid);o.delivery=true;o.address=A.addr.trim();A.addr=null;snack('a',"Yetkazib berishga o'tkazildi");return paintAll();}
  if(b.hasAttribute('data-topickup')){const o=ord(A.oid);o.delivery=false;o.photos=[];snack('a',"Olib ketishga qaytarildi");return paintAll();}
  if(D.cost){A.draft.promo=D.cost;return paint('a');}
  if(b.hasAttribute('data-nopromo')){A.draft.promo='';return paint('a');}
  if(b.hasAttribute('data-hide')){A.draft.hidden=!A.draft.hidden;return paint('a');}
  if(b.hasAttribute('data-psave')){const p=P[A.pid],pr=+A.draft.promo||0;if(pr&&pr>=p.price)return snack('a',"Aksiya narxi chakana narxdan past bo'lishi kerak",1);
    if((pr||null)===p.promo&&A.draft.hidden===p.hidden)return;p.promo=pr||null;p.hidden=A.draft.hidden;snack('a',"Saqlandi · mijoz ilovasi yangilandi");return paintAll();}
  if(D.nq){const [id,d]=D.nq.split(':').map(Number);const n=A.nw.items;n[id]=Math.max(0,(n[id]||0)+d);if(!n[id])delete n[id];return paint('a');}
  if(D.nbr){A.nw.branch=D.nbr;return paint('a');}
  if(D.ndel!=null){A.nw.delivery=D.ndel==='1';return paint('a');}
  if(b.hasAttribute('data-ncreate')){const n=A.nw;if(!lines(n.items).L.length)return snack('a','Kamida bitta mahsulot tanlang',1);
    const found=n.phone.replace(/\D/g,'').endsWith('901234567');if(!found&&!n.name.trim())return snack('a','Mijoz ismini yozing',1);if(n.delivery&&n.address.trim().length<5)return snack('a','Manzilni yozing',1);
    const o=mkOrder({id:S.next++,name:found?ME.name:n.name.trim(),phone:found?ME.phone:n.phone,mine:found,delivery:n.delivery,address:n.delivery?n.address.trim():'',branch:n.branch,items:{...n.items},status:1,src:'admin'});
    S.orders.push(o);S.bot.push({k:'ord',oid:o.id,time:o.time});A.nw=null;A.stack=[];A.r='a-order';A.oid=o.id;enter('a');
    snack('a',`Buyurtma #${o.id} yaratildi`);if(found){S.notifs.unshift({t:`Buyurtma #${o.id} tayyorlanmoqda`,x:"Do'kon siz uchun buyurtma kiritdi va yig'moqda.",oid:o.id,time:now(),unread:true});push('c',{title:`Buyurtma #${o.id} tayyorlanmoqda`,text:"Do'kon siz uchun buyurtma kiritdi va yig'moqda.",to:{r:'c-order',oid:o.id}});}
    return paintAll();}
}
document.addEventListener('click',e=>{
  const sw=e.target.closest('[data-sw]');if(sw)return setSide(sw.dataset.sw);
  if(e.target.closest('.push,#gt'))return;
  const ph=e.target.closest('[data-side]');if(!ph)return;
  const b=e.target.closest('[data-add],[data-part],button,[data-go],[data-tab]');if(!b||b.disabled)return;
  if(b.dataset.add)e.stopPropagation();
  (ph.dataset.side==='c'?clickC:clickA)(b,b.dataset);
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.getAttribute('role')==='button')e.target.click();});
document.addEventListener('input',e=>{const f=e.target.dataset.f;if(!f)return;const v=e.target.value;
  if(f==='c-q'){C.q=v;paint('c');}else if(f==='c-addr')S.address=v;
  else if(f==='a-q'){A.q=v;paint('a');}else if(f==='a-promo'){A.draft.promo=v.replace(/\D/g,'');paint('a');}
  else if(f==='a-addr')A.addr=v;else if(f==='a-nphone'){A.nw.phone=v;paint('a');}else if(f==='a-nname')A.nw.name=v;else if(f==='a-naddr')A.nw.address=v;});
setInterval(()=>document.querySelectorAll('.sbar span:first-child').forEach(s=>s.textContent=now()),20000);
paintAll();
</script>
