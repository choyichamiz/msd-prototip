<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MSD prototipi</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#EEF2F7; --panel:#FFFFFF; --ink:#0E1B33; --muted:#6B778C; --line:#DCE3EC; --blue:#1E6BF0;
  --app:#F4F6FA; --frame:#0E1B33;
  --f:'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){ --bg:#0B1220; --panel:#131C2E; --ink:#E7ECF5; --muted:#8C97AB; --line:#25324A; --frame:#000; color-scheme:dark }}
:root[data-theme="dark"]{ --bg:#0B1220; --panel:#131C2E; --ink:#E7ECF5; --muted:#8C97AB; --line:#25324A; --frame:#000; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.duo{flex:1;display:flex;justify-content:center;align-items:center;gap:clamp(20px,4vw,56px);padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.col{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.cap{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.phone{--w:min(370px,calc((100vh - 70px) * 380 / 790),calc((100vw - 100px) / 2));position:relative;width:var(--w);height:calc(var(--w) * 790 / 380);flex:none;background:var(--frame);border-radius:46px;padding:11px;box-shadow:0 30px 60px -20px rgba(14,27,51,.45)}
.screen{position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;background:var(--app);color:#0E1B33;display:flex;flex-direction:column;font-size:14px}
.sbar{flex:none;height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:12.5px;font-weight:700;color:#0E1B33}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.rel{position:relative}
.sw{display:none}
#gt{display:none}
@media (max-width:819px){
  .sw{flex:none;display:flex;gap:6px;padding:6px max(10px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line)}
  .sw button{flex:1;min-height:40px;border-radius:12px;font-weight:700;font-size:14px;color:var(--muted);position:relative}
  .sw button.on{background:var(--ink);color:var(--panel)}
  .sw i{position:absolute;top:6px;right:10px;width:9px;height:9px;border-radius:50%;background:#D92D20}
  .duo{display:block;padding:0;min-height:0}
  .col{height:100%;gap:0}
  .cap{display:none}
  body:not(.show-a) #colA,body.show-a #colC{display:none}
  .phone{width:100%;height:100%;border-radius:0;padding:0;box-shadow:none;background:var(--app)}
  .screen{border-radius:0}
  .ovl{inset:0!important}
  #gt.on{display:flex;position:fixed;z-index:50;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom,0px));background:#0E1B33;color:#fff;border-radius:14px;padding:12px 14px;gap:10px;align-items:center;font-size:13.5px;box-shadow:0 12px 30px -8px rgba(0,0,0,.5)}
  #gt span{flex:1}#gt b{color:#7FB0FF;white-space:nowrap}
}
/* ===== ilova ichidagi uslublar ===== */
.ap{padding:0 14px 16px;display:flex;flex-direction:column;gap:14px}
.ahead{display:flex;align-items:center;justify-content:space-between;padding:4px 14px 8px}
.logo{font-weight:900;font-size:22px;letter-spacing:-.02em;color:#1E6BF0}
.logo small{display:block;font-size:7px;letter-spacing:.2em;color:#0E1B33;margin-top:-4px;text-align:right}
.ibs{display:flex;gap:14px}
.ic{width:22px;height:22px;stroke:#0E1B33;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid #DCE3EC;border-radius:14px;height:44px;padding:0 12px;color:#8A93A6;font-size:14px}
.banner{border-radius:18px;padding:16px;color:#fff;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(135deg,#1E6BF0,#1550BD);position:relative;overflow:hidden}
.banner b{font-size:18px;line-height:1.2;max-width:62%}
.banner span{font-size:12px;opacity:.85;max-width:62%}
.banner .go{align-self:flex-start;background:rgba(255,255,255,.18);border-radius:10px;padding:6px 12px;font-weight:600;font-size:13px}
.banner img{position:absolute;right:-6px;bottom:-6px;width:110px;height:110px;object-fit:contain;transform:rotate(-8deg)}
.dots{display:flex;justify-content:center;gap:5px;margin-top:-6px}
.dots i{width:6px;height:6px;border-radius:3px;background:#C9D2E0}.dots i.on{width:18px;background:#1E6BF0}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px}
.chip{flex:none;display:flex;align-items:center;gap:6px;background:#fff;border:1.5px solid #DCE3EC;border-radius:999px;padding:7px 12px;font-weight:600;font-size:13px;color:#0E1B33}
.chip.on{background:#0E1B33;color:#fff;border-color:#0E1B33}
.finder{border-radius:18px;padding:16px;background:linear-gradient(160deg,#1550BD,#1E3A8A);color:#fff;display:flex;flex-direction:column;gap:10px}
.finder b{font-size:17px;line-height:1.25}
.finder small{opacity:.8}
.brands{display:flex;flex-wrap:wrap;gap:6px}
.brands span{background:rgba(255,255,255,.14);border-radius:9px;padding:5px 10px;font-weight:600;font-size:12.5px}
.finder .sel{background:#fff;color:#0E1B33;border-radius:12px;padding:11px 12px;font-weight:600;display:flex;justify-content:space-between}
.sh{display:flex;justify-content:space-between;align-items:baseline}
.sh b{font-size:17px}.sh a{color:#1E6BF0;font-weight:600;font-size:13px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pc{background:#fff;border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:5px;text-align:left;box-shadow:0 1px 2px rgba(14,27,51,.06)}
.pimg{position:relative;aspect-ratio:1;border-radius:12px;background:radial-gradient(circle at 50% 40%,#fff,#EDF1F6 75%);display:grid;place-items:center;overflow:hidden}
.pimg img{width:88%;height:88%;object-fit:contain}
.tag{position:absolute;left:6px;top:6px;display:flex;gap:4px}
.tag i{font-style:normal;font-size:10px;font-weight:700;border-radius:6px;padding:1px 6px;background:#EAF2FF;color:#1550BD}
.tag i.n{background:#15803D;color:#fff}
.pc .nm{font-size:12.5px;font-weight:600;line-height:1.3;height:33px;overflow:hidden;color:#0E1B33}
.pc .pr{font-weight:800;font-size:15px;color:#0E1B33}
.pc .op{font-size:11px;color:#15803D;font-weight:600}
.add{background:#1E6BF0;color:#fff;border-radius:10px;padding:7px;font-weight:700;font-size:13px;text-align:center}
.bundle{background:#fff;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.bundle .row{display:flex;gap:6px}
.bundle .mini{flex:1;aspect-ratio:1;border-radius:10px;background:#EEF2F7;display:grid;place-items:center}
.tabbar{flex:none;display:flex;justify-content:space-around;background:#fff;border-top:1px solid #E6EBF2;padding:7px 0 14px}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:#8A93A6;position:relative}
.tabbar button.on{color:#1E6BF0}.tabbar button.on .ic{stroke:#1E6BF0}
.tabbar .ic{stroke:#8A93A6}
.badge{position:absolute;top:-4px;right:-2px;background:#D92D20;color:#fff;font-size:9.5px;font-weight:700;border-radius:8px;padding:0 5px}
.navbar{flex:none;display:flex;align-items:center;gap:8px;padding:2px 10px 8px}
.navbar b{font-size:16.5px;flex:1;text-align:center;margin-right:32px}
.back{width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center}
.card{background:#fff;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.list .li{display:flex;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:8px;text-align:left;width:100%}
.list{display:flex;flex-direction:column;gap:8px}
.th{width:56px;height:56px;flex:none;border-radius:10px;background:radial-gradient(circle at 50% 40%,#fff,#EDF1F6 75%);display:grid;place-items:center;overflow:hidden}
.th img{width:90%;height:90%;object-fit:contain}
.li .nm{font-size:13px;font-weight:600;line-height:1.3}
.li .sub{font-size:11.5px;color:#6B778C}
.li .pr{font-weight:800;font-size:14px;margin-left:auto;white-space:nowrap}
.big{aspect-ratio:1.15;background:radial-gradient(circle at 50% 40%,#fff,#E9EEF5 75%);border-radius:18px;display:grid;place-items:center}
.big img{width:70%;height:84%;object-fit:contain}
.price{font-size:24px;font-weight:800}
.optbox{background:#E8F7EE;border-radius:12px;padding:10px 12px;color:#14532D;font-size:13px}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid #EEF1F6}
.kv:last-child{border:0}.kv span{color:#6B778C}
.stepper{display:flex;align-items:center;gap:0;border:1.5px solid #DCE3EC;border-radius:12px;overflow:hidden;background:#fff}
.stepper button{width:36px;height:36px;font-size:18px;font-weight:700;color:#1E6BF0}
.stepper span{min-width:30px;text-align:center;font-weight:700}
.btn{background:#1E6BF0;color:#fff;border-radius:14px;padding:13px;font-weight:700;text-align:center;width:100%}
.btn.sec{background:#EAF2FF;color:#1550BD}
.btn.grn{background:#15803D}
.btn:disabled{opacity:.45}
.bottom{flex:none;background:rgba(255,255,255,.97);border-top:1px solid #E6EBF2;padding:10px 14px 14px;display:flex;flex-direction:column;gap:4px;align-items:center}
.bottom small{font-size:11px;color:#6B778C}
.tg{display:flex;background:#E9EDF3;border-radius:12px;padding:3px;gap:2px}
.tg button{flex:1;min-height:38px;border-radius:10px;font-weight:600;font-size:13px;color:#6B778C}
.tg button.on{background:#fff;color:#0E1B33;box-shadow:0 1px 2px rgba(14,27,51,.12)}
.inp{background:#fff;border:1.5px solid #DCE3EC;border-radius:12px;padding:10px 12px;font-size:13.5px;color:#0E1B33;min-height:44px}
.inp.ph{color:#8A93A6}
.radio{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid #DCE3EC;border-radius:14px;padding:11px;text-align:left;width:100%}
.radio.on{border:2px solid #1E6BF0;background:#EAF2FF}
.radio i{width:20px;height:20px;border-radius:50%;border:2px solid #B6BECC;flex:none}
.radio.on i{border:6px solid #1E6BF0}
.radio small{display:block;font-size:11.5px;color:#6B778C}
.radio em{margin-left:auto;font-style:normal;font-size:11.5px;font-weight:600;color:#15803D}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.slots button{border-radius:999px;background:#fff;border:1.5px solid #DCE3EC;padding:7px 0;font-size:12px;font-weight:600}
.slots button.on{background:#0E1B33;color:#fff;border-color:#0E1B33}
.note{border-radius:12px;padding:10px 12px;font-size:12.5px;background:#EAF2FF;color:#1550BD}
.note.a{background:#FFF4E0;color:#92400E}
.h3{font-weight:800;font-size:15.5px;margin-top:4px}
.st{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.st.s0{background:#EAF2FF;color:#1550BD}.st.s1{background:#FFF4E0;color:#B45309}.st.s2{background:#E8F7EE;color:#15803D}.st.s3{background:#EEF1F6;color:#3B4860}
.tl{display:flex;flex-direction:column;gap:14px;padding-left:4px}
.tl div{display:flex;gap:12px;align-items:center}
.tl i{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:800;background:#EEF1F6;color:#8A93A6}
.tl .d i{background:#15803D;color:#fff}.tl .c i{background:#1E6BF0;color:#fff;box-shadow:0 0 0 4px #D6E5FF}
.tl b{font-size:13.5px}.tl small{display:block;color:#6B778C;font-size:11.5px}
.ship{display:flex;gap:8px}
.ship div{width:96px;height:96px;border-radius:12px;background:linear-gradient(135deg,#C9D6E8,#8FA3BF);display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;text-align:center}
.av{width:52px;height:52px;border-radius:50%;background:#1E6BF0;color:#fff;font-weight:800;font-size:18px;display:grid;place-items:center}
.menu .li{justify-content:flex-start}
.menu .li .ic{margin:0 4px}
/* admin (Telegram) */
.tgbar{flex:none;background:#fff;border-bottom:1px solid #E6EBF2;padding:6px 12px 10px;display:flex;align-items:center;gap:8px}
.tgbar b{flex:1;text-align:center;font-size:15.5px}
.tgbar small{display:block;text-align:center;font-size:11px;color:#6B778C;font-weight:500}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat div{background:#fff;border-radius:14px;padding:11px}
.stat small{display:block;color:#6B778C;font-size:11.5px}
.stat b{font-size:19px;font-variant-numeric:tabular-nums}
.ord{background:#fff;border-radius:14px;padding:11px;display:flex;flex-direction:column;gap:4px;text-align:left;width:100%}
.ord .r{display:flex;justify-content:space-between;align-items:center;gap:6px}
.ord small{color:#6B778C;font-size:12px}
.aseg{display:flex;background:#E9EDF3;border-radius:11px;padding:3px}
.aseg button{flex:1;padding:7px 2px;border-radius:9px;font-size:12px;font-weight:600;color:#6B778C}
.aseg button.on{background:#fff;color:#0E1B33}
.aseg i{font-style:normal;background:#D92D20;color:#fff;border-radius:7px;padding:0 5px;font-size:10px;margin-left:3px}
.ptile{width:78px;height:78px;border-radius:12px;display:grid;place-items:center;font-size:11px;font-weight:700;text-align:center}
.ptile.dash{border:1.5px dashed #1E6BF0;background:#EAF2FF;color:#1E6BF0}
.ptile.ph{background:linear-gradient(135deg,#C9D6E8,#8FA3BF);color:#fff}
.tgchat{flex:1;background:#CFE3F2;padding:12px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.msg{background:#fff;border-radius:14px 14px 14px 4px;padding:10px 12px;font-size:12.5px;line-height:1.45;max-width:92%;white-space:pre-line}
.kb{display:grid;grid-template-columns:1fr 1fr;gap:4px;max-width:92%}
.kb span{background:rgba(255,255,255,.75);border-radius:8px;padding:7px;text-align:center;font-size:12px;font-weight:600;color:#1550BD}
.kb span.w{grid-column:1/-1}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;padding-top:6px}
.bars div{flex:1;background:#1E6BF0;border-radius:6px 6px 2px 2px;position:relative}
.bars div span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:#6B778C}
/* qo'shimcha */
input.inp,textarea.inp{width:100%;font:inherit;font-size:13.5px;color:#0E1B33;outline:none;display:block}
textarea.inp{resize:none;min-height:64px;line-height:1.4}
input.inp:focus,textarea.inp:focus{border-color:#1E6BF0}
.inp.bad{border-color:#D92D20}
.old{text-decoration:line-through;color:#8A93A6;font-weight:600}
.tag i.p{background:#D92D20;color:#fff}
.pc .pr.red,.price.red{color:#D92D20}
.st.sx{background:#FDECEA;color:#D92D20}
.banner.promo{background:linear-gradient(135deg,#D92D20,#9F1D14)}
.banner.promo img,.banner.promo svg{position:absolute;right:4px;bottom:4px;width:96px;height:96px;transform:rotate(-8deg)}
.ibs button{position:relative}
.ibs .badge{top:-5px;right:-6px}
.ovl{position:absolute;inset:11px;border-radius:36px;overflow:hidden;pointer-events:none;z-index:30}
.pushes{position:absolute;left:8px;right:8px;top:38px;display:flex;flex-direction:column;gap:6px}
.push{pointer-events:auto;display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:rgba(255,255,255,.97);color:#0E1B33;border-radius:18px;padding:10px 12px;box-shadow:0 12px 30px -8px rgba(14,27,51,.4);border:1px solid #E6EBF2}
.push.tg{background:rgba(28,36,48,.97);color:#fff;border-color:#2E3A4C}
.push .pi{width:34px;height:34px;border-radius:9px;background:#1E6BF0;color:#fff;font-weight:900;font-size:10.5px;display:grid;place-items:center;flex:none;letter-spacing:-.02em}
.push.tg .pi{border-radius:50%;background:#2AABEE;font-size:15px}
.push .pt{flex:1;min-width:0}
.push b{font-size:13px;display:flex;justify-content:space-between;gap:6px;line-height:1.3}
.push b small{font-weight:500;opacity:.6;font-size:11px}
.push span{font-size:12.5px;line-height:1.35;display:block;margin-top:1px}
.snack{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);background:#0E1B33;color:#fff;border-radius:12px;padding:9px 14px;font-size:12.5px;font-weight:600;max-width:86%;text-align:center;box-shadow:0 8px 20px -6px rgba(0,0,0,.4)}
.snack.err{background:#D92D20}
@media (prefers-reduced-motion:no-preference){
  .push{animation:pin .4s cubic-bezier(.2,.9,.3,1.15)}
  .push.out{animation:pout .3s forwards}
  .snack{animation:sin .25s ease}
  .screen.fresh>*{animation:fade .18s ease}
  .scroll{scroll-behavior:auto}
  @keyframes pin{from{transform:translateY(-130%);opacity:0}}
  @keyframes pout{to{transform:translateY(-130%);opacity:0}}
  @keyframes sin{from{opacity:0;transform:translate(-50%,8px)}}
  @keyframes fade{from{opacity:.4}to{opacity:1}}
  .ord.unseen{animation:glow 1.4s ease 2}
  @keyframes glow{50%{box-shadow:0 0 0 4px #BFD6FF}}
}
.ord.unseen{border:2px solid #1E6BF0}
.ord .nw{font-size:10px;font-weight:800;background:#1E6BF0;color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px}
.tgl{width:46px;height:28px;border-radius:14px;background:#C9D2E0;position:relative;flex:none;transition:background .2s}
.tgl::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tgl.on{background:#15803D}.tgl.on::after{left:21px}
.row{display:flex;gap:8px;align-items:center}
.ptiles{display:flex;gap:8px;flex-wrap:wrap}
.ptile{position:relative;overflow:visible;padding:0}
.ptile svg{width:100%;height:100%;display:block;border-radius:12px}
.ptile .x{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;background:#D92D20;color:#fff;font-size:14px;line-height:20px;font-weight:700;display:grid;place-items:center}
.shipg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.shipg svg{width:100%;aspect-ratio:1;border-radius:10px;display:block}
.btn.dim{opacity:.45}
.btn.red{background:#FDECEA;color:#D92D20}
.kb{display:grid;grid-template-columns:1fr 1fr;gap:4px;max-width:92%}
.kb button{background:rgba(255,255,255,.8);border-radius:8px;padding:8px 6px;text-align:center;font-size:12px;font-weight:600;color:#1550BD}
.kb .w{grid-column:1/-1}
.msg time{display:block;text-align:right;font-size:10.5px;color:#8A93A6;margin-top:2px}
.msg.sys{align-self:center;background:rgba(14,27,51,.35);color:#fff;border-radius:10px;font-size:11.5px;padding:4px 10px}
.empty{text-align:center;color:#6B778C;font-size:13px;padding:24px 10px}
.lock{font-size:11px;color:#6B778C;font-weight:600}
.cnt{font-size:11px;color:#6B778C}
.bars div.today{background:#15803D}
.bars div.fut{background:#DCE3EC}
.nrow{display:flex;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:10px;text-align:left;width:100%}
.nrow.unread{background:#EAF2FF}
.nrow .dotb{width:8px;height:8px;border-radius:50%;background:#1E6BF0;flex:none}

Mijoz: ${o.name}
Tel: ${o.phone}
Filial: <b>${BR[o.branch].k}</b>
${o.delivery?`🚚 <b>Yetkazib berish</b>: ${o.address}\nVaqt: ${dayTxt(o).toLowerCase()}, ${o.slot}`:`Olib ketish: ${dayTxt(o).toLowerCase()}, ${o.slot}`}

${o.items.map(i=>`${P[i.id].name} × ${i.q} = ${num(i.unit*i.q)}${i.w?' (optom)':''}${i.promo?' (aksiya)':''}`).join('\n')}

<b>Jami: ${fm(o.total)}</b>
${o.delivery?"To'lov: yetkazilganda":"To'lov: do'konda"}

function botKb(o){const id=o.id,s=o.status,d=o.delivery;const B=(t,a,w)=>`<button class="${w?'w':''}" data-bot="${id}:${a}">${t}</button>`;const open=t=>`<button class="w" data-botopen="${id}">${t}</button>`;
  if(s<0||s===3)return '';
  if(d&&s<2)return (s===0?B('✅ Qabul qilish',1,1):'')+open("📷 Yuklash rasmi va jo'natish")+B('Bekor qilish',-1,1);
  if(d&&s===2)return B('✔️ Yetkazildi',3,1)+B('Bekor qilish',-1,1)+open('Panelda ochish');
  if(s===0)return B('✅ Qabul qilish',1)+B('Tayyor',2)+B('Bekor qilish',-1,1)+open('Panelda ochish');
  if(s===1)return B('📦 Tayyor — mijozga xabar',2,1)+B('Bekor qilish',-1,1)+open('Panelda ochish');
  return B('✔️ Olib ketildi',3,1)+B('Bekor qilish',-1,1)+open('Panelda ochish');}

  'a-bot':()=>`${sbar()}<div class="tgbar"><button class="back" data-back aria-label="Orqaga">${ic('left',20)}</button><b>MSD Admin<small>bot</small></b><span style="width:34px"></span></div><div class="tgchat">
    ${S.bot.map(m=>m.k==='sys'?`<div class="msg sys">${m.text}</div>`:m.k==='txt'?`<div class="msg">${m.text}<time>${m.time}</time></div>`:`<div class="msg">${orderText(ord(m.oid))}<time>${m.time}</time></div>${botKb(ord(m.oid))?`<div class="kb">${botKb(ord(m.oid))}</div>`:''}`).join('')}
    </div>${atab('a-bot')}`,
};

/* ===== chizish ===== */
const last={c:null,a:null};
function paint(side){
  const el=document.getElementById(side==='c'?'cs':'as'),x=X(side),key=x.r+'|'+x.oid+'|'+x.pid;
  const ae=document.activeElement,f=ae&&el.contains(ae)?ae.dataset.f:null,sel=f?ae.selectionStart:0;
  const sc=el.querySelector('.scroll'),top=last[side]===key&&sc?sc.scrollTop:0,chat=el.querySelector('.tgchat');
  const atBottom=!chat||chat.scrollHeight-chat.scrollTop-chat.clientHeight<40;
  el.innerHTML=(side==='c'?CS:AS)[x.r]();
  el.classList.toggle('fresh',last[side]!==key);last[side]=key;
  const n=el.querySelector('.scroll');if(n)n.scrollTop=top;
  const ch=el.querySelector('.tgchat');if(ch&&atBottom)ch.scrollTop=ch.scrollHeight;
  if(f){const i=el.querySelector(`[data-f="${f}"]`);if(i){i.focus();try{const p=Math.min(sel,i.value.length);i.setSelectionRange(p,p);}catch(e){}}}
}
function paintAll(){paint('c');paint('a');document.querySelectorAll('[data-sw]').forEach(b=>{const s=b.dataset.sw;b.classList.toggle('on',side()===s);b.querySelector('i').hidden=!S.sw[s];});}
const mobile=()=>matchMedia('(max-width:819px)').matches;
const side=()=>document.body.classList.contains('show-a')?'a':'c';
function setSide(s){document.body.classList.toggle('show-a',s==='a');S.sw[s]=false;document.getElementById('gt').classList.remove('on');paintAll();}

function snack(sd,text,err){const o=document.querySelector(`#${sd==='c'?'co':'ao'}`);o.querySelector('.snack')?.remove();const d=document.createElement('div');d.className='snack'+(err?' err':'');d.textContent=text;o.appendChild(d);setTimeout(()=>d.remove(),2600);}
function push(sd,{title,text,to}){
  const box=document.querySelector(`#${sd==='c'?'co':'ao'} .pushes`);const b=document.createElement('button');b.className='push'+(sd==='a'?' tg':'');
  b.innerHTML=`<span class="pi">${sd==='a'?'🤖':'MSD'}</span><span class="pt"><b>${title}<small>hozir</small></b><span></span></span>`;b.querySelector('.pt>span').textContent=text;
  const open=()=>{if(mobile()&&side()!==sd)setSide(sd);if(to){const x=X(sd);if(!(x.r===to.r&&x.oid===to.oid))nav(sd,to.r,to);}b.remove();};
  b.onclick=open;box.prepend(b);while(box.children.length>2)box.lastChild.remove();
  setTimeout(()=>{b.classList.add('out');setTimeout(()=>b.remove(),320);},5000);
  if(mobile()&&side()!==sd){S.sw[sd]=true;const g=document.getElementById('gt');g.innerHTML=`<span>${sd==='a'?'🤖 Admin panelga':'📱 Mijoz ilovasiga'}: ${text}</span><b>Ko'rish ›</b>`;g.onclick=open;g.classList.add('on');clearTimeout(g._t);g._t=setTimeout(()=>g.classList.remove('on'),6000);}
}

/* ===== amallar ===== */
function setStatus(o,s){
  if(!NEXT[o.status].includes(s))return snack('a',"Bu holatga o'tkazib bo'lmaydi",1);
  if(o.delivery&&s===2&&!o.photos.length)return snack('a','Avval mashinaga yuklash rasmini yuklang',1);
  o.status=s;o.seen=true;
  if(o.mine){const [t,x]=custMsg(o,s);S.notifs.unshift({t,x,oid:o.id,time:now(),unread:true});push('c',{title:t,text:x,to:{r:'c-order',oid:o.id}});}
  snack('a',s===-1?'Buyurtma bekor qilindi':s===3?"Yakunlandi · hisobotga qo'shildi":`Holat: ${STN(o)}${o.mine?' · mijozga xabar ketdi':''}`);
  paintAll();
}
function placeOrder(){
  const {L}=lines(S.cart);if(!L.length)return;
  if(S.delivery&&S.address.trim().length<5)return snack('c','Yetkazish manzilini yozing',1);
  const o=mkOrder({id:S.next++,name:ME.name,phone:ME.phone,mine:true,delivery:S.delivery,address:S.delivery?S.address.trim():'',branch:S.branch,day:S.day,slot:S.slot,items:{...S.cart},status:0,seen:false});
  S.orders.push(o);S.cart={};S.bot.push({k:'ord',oid:o.id,time:o.time});
  C.stack=[];C.r='c-order';C.oid=o.id;enter('c');
  snack('c',"Buyurtma yuborildi. Do'kon tasdiqlashini kuting.");
  push('a',{title:'MSD Admin bot',text:`Yangi buyurtma #${o.id} · ${o.name} · ${fm(o.total)}${o.delivery?' · 🚚 yetkazish':''}`,to:{r:'a-order',oid:o.id}});
  paintAll();
}
function addCart(id,d){S.cart[id]=Math.max(0,(S.cart[id]||0)+d);if(!S.cart[id])delete S.cart[id];}

function clickC(b,D){
  if(D.add){addCart(+D.add,1);snack('c',"Savatga qo'shildi");return paintAll();}
  if(D.padd){addCart(+D.padd,1);snack('c',"Savatga qo'shildi");return paintAll();}
  if(D.q){const [id,d]=D.q.split(':');addCart(+id,+d);return paintAll();}
  if(D.back!=null)return back('c');
  if(D.tab)return tab('c',D.tab);
  if(D.go){if(D.cat)C.cat=D.cat;if(D.q!=null&&D.go==='c-catalog')C.q='';return nav('c',D.go,{pid:D.pid&&+D.pid,oid:D.oid&&+D.oid});}
  if(D.brand!=null){C.cat='Ekranlar';C.q=D.brand;return nav('c','c-catalog');}
  if(D.cat){C.cat=D.cat;return paint('c');}
  if(D.clearq!=null){C.q='';return paint('c');}
  if(D.del!=null){S.delivery=D.del==='1';return paint('c');}
  if(D.br){S.branch=D.br;return paint('c');}
  if(D.day!=null){S.day=+D.day;return paint('c');}
  if(D.slot){S.slot=D.slot;return paint('c');}
  if(b.hasAttribute('data-place'))return placeOrder();
  if(b.hasAttribute('data-bundle')){[1452,1455,1688,3498].filter(vis).forEach(id=>addCart(id,1));snack('c',"To'plam savatga qo'shildi");return paintAll();}
  if(D.ccancel){const o=ord(+D.ccancel);if(C.confirm!==o.id){C.confirm=o.id;return paint('c');}
    if(o.status>=2)return snack('c',"Buyurtma tayyor — bekor qilish uchun do'konga qo'ng'iroq qiling",1);
    o.status=-1;C.confirm=null;S.bot.push({k:'txt',time:now(),text:`❌ <b>Mijoz buyurtmani bekor qildi</b> · #${o.id}\n${o.name}, ${o.phone}`});
    snack('c','Buyurtma bekor qilindi');push('a',{title:'MSD Admin bot',text:`❌ Mijoz #${o.id} buyurtmani bekor qildi`,to:{r:'a-order',oid:o.id}});return paintAll();}
  if(D.reorder){ord(+D.reorder).items.forEach(i=>{if(vis(i.id))addCart(i.id,i.q);});snack('c',"Mahsulotlar savatga qo'shildi");return tab('c','c-cart');}
}
function clickA(b,D){
  if(D.back!=null)return back('a');
  if(D.tab)return tab('a',D.tab);
  if(D.go)return nav('a',D.go,{pid:D.pid&&+D.pid,oid:D.oid&&+D.oid});
  if(D.grp){A.grp=D.grp;return paint('a');}
  if(D.abr){A.br=D.abr;return paint('a');}
  if(D.per){A.per=D.per;return paint('a');}
  if(D.st!=null)return setStatus(ord(A.oid),+D.st);
  if(D.bot){const [id,s]=D.bot.split(':').map(Number);return setStatus(ord(id),s);}
  if(D.botopen)return nav('a','a-order',{oid:+D.botopen});
  if(b.hasAttribute('data-photo')){const o=ord(A.oid);o.photos.push((o.photos.length+o.id)%6);snack('a',o.mine?"Rasm yuklandi · mijoz ilovasida ko'rinadi":'Rasm yuklandi');return paintAll();}
  if(D.rmph!=null){ord(A.oid).photos.splice(+D.rmph,1);return paintAll();}
  if(b.hasAttribute('data-addr')){A.addr=ord(A.oid).address||'';return paint('a');}
  if(b.hasAttribute('data-addrno')){A.addr=null;return paint('a');}
  if(b.hasAttribute('data-addrsave')){if(A.addr.trim().length<5)return snack('a','Manzilni to\'liq yozing',1);const o=ord(A.oid);o.delivery=true;o.address=A.addr.trim();A.addr=null;snack('a',"Yetkazib berishga o'tkazildi");return paintAll();}
  if(b.hasAttribute('data-topickup')){const o=ord(A.oid);o.delivery=false;o.photos=[];snack('a',"Olib ketishga qaytarildi");return paintAll();}
  if(D.cost){A.draft.promo=D.cost;return paint('a');}
  if(b.hasAttribute('data-nopromo')){A.draft.promo='';return paint('a');}
  if(b.hasAttribute('data-hide')){A.draft.hidden=!A.draft.hidden;return paint('a');}
  if(b.hasAttribute('data-psave')){const p=P[A.pid],pr=+A.draft.promo||0;if(pr&&pr>=p.price)return snack('a',"Aksiya narxi chakana narxdan past bo'lishi kerak",1);
    if((pr||null)===p.promo&&A.draft.hidden===p.hidden)return;p.promo=pr||null;p.hidden=A.draft.hidden;snack('a',"Saqlandi · mijoz ilovasi yangilandi");return paintAll();}
  if(D.nq){const [id,d]=D.nq.split(':').map(Number);const n=A.nw.items;n[id]=Math.max(0,(n[id]||0)+d);if(!n[id])delete n[id];return paint('a');}
  if(D.nbr){A.nw.branch=D.nbr;return paint('a');}
  if(D.ndel!=null){A.nw.delivery=D.ndel==='1';return paint('a');}
  if(b.hasAttribute('data-ncreate')){const n=A.nw;if(!lines(n.items).L.length)return snack('a','Kamida bitta mahsulot tanlang',1);
    const found=n.phone.replace(/\D/g,'').endsWith('901234567');if(!found&&!n.name.trim())return snack('a','Mijoz ismini yozing',1);if(n.delivery&&n.address.trim().length<5)return snack('a','Manzilni yozing',1);
    const o=mkOrder({id:S.next++,name:found?ME.name:n.name.trim(),phone:found?ME.phone:n.phone,mine:found,delivery:n.delivery,address:n.delivery?n.address.trim():'',branch:n.branch,items:{...n.items},status:1,src:'admin'});
    S.orders.push(o);S.bot.push({k:'ord',oid:o.id,time:o.time});A.nw=null;A.stack=[];A.r='a-order';A.oid=o.id;enter('a');
    snack('a',`Buyurtma #${o.id} yaratildi`);if(found){S.notifs.unshift({t:`Buyurtma #${o.id} tayyorlanmoqda`,x:"Do'kon siz uchun buyurtma kiritdi va yig'moqda.",oid:o.id,time:now(),unread:true});push('c',{title:`Buyurtma #${o.id} tayyorlanmoqda`,text:"Do'kon siz uchun buyurtma kiritdi va yig'moqda.",to:{r:'c-order',oid:o.id}});}
    return paintAll();}
}
document.addEventListener('click',e=>{
  const sw=e.target.closest('[data-sw]');if(sw)return setSide(sw.dataset.sw);
  if(e.target.closest('.push,#gt'))return;
  const ph=e.target.closest('[data-side]');if(!ph)return;
  const b=e.target.closest('[data-add],button,[data-go],[data-tab]');if(!b||b.disabled)return;
  if(b.dataset.add)e.stopPropagation();
  (ph.dataset.side==='c'?clickC:clickA)(b,b.dataset);
});
document.addEventListener('input',e=>{const f=e.target.dataset.f;if(!f)return;const v=e.target.value;
  if(f==='c-q'){C.q=v;paint('c');}else if(f==='c-addr')S.address=v;
  else if(f==='a-q'){A.q=v;paint('a');}else if(f==='a-promo'){A.draft.promo=v.replace(/\D/g,'');paint('a');}
  else if(f==='a-addr')A.addr=v;else if(f==='a-nphone'){A.nw.phone=v;paint('a');}else if(f==='a-nname')A.nw.name=v;else if(f==='a-naddr')A.nw.address=v;});
setInterval(()=>document.querySelectorAll('.sbar span:first-child').forEach(s=>s.textContent=now()),20000);
paintAll();
</script>
